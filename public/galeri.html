<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faaliyetlerimiz — Hayır Limanı Derneği</title>
  <meta name="description" content="Hayır Limanı Derneği etkinlik ve çalışmalarından fotoğraf ve video faaliyetlerimiz.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/images/icon.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .gal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 22px; padding-bottom: 56px;
    }
    .gal-card {
      background: #fff; border-radius: 12px; overflow: hidden;
      border: 1px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,.05);
      transition: box-shadow .18s, transform .18s;
      text-decoration: none; color: inherit; display: block;
    }
    .gal-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.1); transform: translateY(-3px); }
    .gal-card-cover {
      position: relative; width: 100%; height: 210px; overflow: hidden; background: var(--bg);
    }
    .gal-card-cover img {
      width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s;
    }
    .gal-card:hover .gal-card-cover img { transform: scale(1.04); }
    .gal-card-cover-ph {
      width: 100%; height: 210px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
    }
    .gal-card-count {
      position: absolute; bottom: 10px; right: 10px;
      background: rgba(0,0,0,.55); color: #fff; padding: 3px 9px;
      border-radius: 999px; font-size: .72rem; font-weight: 600;
      backdrop-filter: blur(4px);
      display: flex; align-items: center; gap: 5px;
    }
    .gal-card-body { padding: 16px 18px 18px; }
    .gal-card-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: .75rem; color: var(--muted); }
    .gal-card-title { font-size: 1.05rem; font-weight: 700; color: var(--text); line-height: 1.4; margin: 0 0 6px; }
    .gal-card-desc { font-size: .84rem; color: var(--muted); line-height: 1.6; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .gal-card-arrow { display: flex; align-items: center; justify-content: flex-end; margin-top: 12px; color: var(--brand); font-size: .82rem; font-weight: 600; }

    .gal-empty { text-align: center; padding: 80px 20px; color: var(--muted); }
    .gal-empty svg { display: block; margin: 0 auto 20px; opacity: .3; }
    .gal-empty h3 { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }

    @media (max-width: 640px) {
      .gal-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .gal-card-cover, .gal-card-cover-ph { height: 160px; }
    }
    @media (max-width: 380px) {
      .gal-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <section class="page-hero">
    <div class="container">
      <h1>Faaliyetlerimiz</h1>
      <div class="breadcrumb"><a href="/">Anasayfa</a> / Faaliyetlerimiz</div>
    </div>
  </section>

  <div class="container" style="padding-top: 36px">
    <div class="gal-grid" id="gal-grid">
      <div class="gal-empty">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.4" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <h3>Yükleniyor…</h3>
      </div>
    </div>
  </div>

  <div id="pre-footer-cta"></div>
  <footer id="site-footer" class="footer"></footer>
  <script src="/js/main.js"></script>
  <script>
    function stripHtml(html) {
      const d = document.createElement('div'); d.innerHTML = html; return d.textContent || '';
    }

    window.addEventListener('app-ready', async () => {
      const albums = await api('/api/gallery');
      const grid = document.getElementById('gal-grid');

      if (!Array.isArray(albums) || !albums.length) {
        grid.innerHTML = `
          <div class="gal-empty">
            <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.4" viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <h3>Henüz faaliyet albümü yok.</h3>
            <p>Daha sonra tekrar kontrol edin.</p>
          </div>`;
        return;
      }

      grid.innerHTML = albums.map(a => {
        const date = a.event_date
          ? new Date(a.event_date).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' })
          : '';
        const desc = stripHtml(a.description || '');
        const cover = a.cover_image
          ? `<img src="${escapeHtml(a.cover_image)}" alt="${escapeHtml(a.title)}" loading="lazy" />`
          : `<div class="gal-card-cover-ph">
              <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".35" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </div>`;

        return `
          <a class="gal-card" href="/galeri-detay.html?slug=${encodeURIComponent(a.slug)}">
            <div class="gal-card-cover">
              ${cover}
              ${a.media_count ? `<span class="gal-card-count">
                <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                ${a.media_count} öğe
              </span>` : ''}
            </div>
            <div class="gal-card-body">
              <div class="gal-card-meta">
                ${date ? `<span>
                  <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  ${date}
                </span>` : ''}
                ${a.location ? `<span>
                  <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                  ${escapeHtml(a.location)}
                </span>` : ''}
              </div>
              <h2 class="gal-card-title">${escapeHtml(a.title)}</h2>
              ${desc ? `<p class="gal-card-desc">${escapeHtml(desc)}</p>` : ''}
              <div class="gal-card-arrow">Albümü Gör →</div>
            </div>
          </a>`;
      }).join('');
    });
  </script>
</body>
</html>
