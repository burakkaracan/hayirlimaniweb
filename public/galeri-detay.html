<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Galeri — Hayır Limanı Derneği</title>
  <meta name="description" id="page-desc" content="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/images/icon.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .album-hero-cover {
      width: 100%; max-height: 420px; object-fit: cover; display: block;
      border-radius: 0 0 20px 20px;
    }
    .album-wrap { max-width: 960px; margin: 0 auto; padding: 36px 20px 72px; }

    .album-breadcrumb { font-size: .8rem; color: var(--muted); margin-bottom: 20px; }
    .album-breadcrumb a { color: var(--brand); text-decoration: none; }
    .album-breadcrumb a:hover { text-decoration: underline; }

    .album-header { margin-bottom: 24px; }
    .album-meta { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); margin-bottom: 10px; }
    .album-meta-item { display: flex; align-items: center; gap: 5px; }
    .album-title { font-size: 2rem; font-weight: 800; color: var(--text); line-height: 1.3; margin: 0 0 16px; }

    .album-description { font-size: 1rem; line-height: 1.8; color: var(--text); padding-bottom: 28px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
    .album-description h2 { font-size: 1.4rem; margin: 1.2rem 0 .5rem; }
    .album-description h3 { font-size: 1.15rem; margin: 1rem 0 .4rem; }
    .album-description p { margin: 0 0 1em; }
    .album-description ul, .album-description ol { padding-left: 1.5em; margin: 0 0 1em; }
    .album-description blockquote { border-left: 4px solid var(--brand); padding: 12px 18px; margin: 1.2rem 0; background: #f0fdfa; border-radius: 0 8px 8px 0; color: #0f766e; font-style: italic; }
    .album-description a { color: var(--brand); }

    /* --- Media grid --- */
    .album-media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .album-media-item { position: relative; border-radius: 8px; overflow: hidden; background: #111; cursor: pointer; }
    .album-media-item img {
      width: 100%; height: 200px; object-fit: cover; display: block;
      transition: transform .25s, opacity .2s;
    }
    .album-media-item:hover img { transform: scale(1.04); opacity: .88; }
    .album-media-video { height: 200px; display: flex; align-items: center; justify-content: center; background: #1e293b; }
    .album-media-video svg { opacity: .8; transition: opacity .2s; }
    .album-media-item:hover .album-media-video svg { opacity: 1; }
    .album-media-caption {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,.7), transparent);
      color: #fff; font-size: .72rem; padding: 20px 10px 8px;
      opacity: 0; transition: opacity .2s;
    }
    .album-media-item:hover .album-media-caption { opacity: 1; }
    .album-media-video-badge {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,.55); color: #fff; padding: 2px 8px;
      border-radius: 999px; font-size: .68rem; font-weight: 600;
      backdrop-filter: blur(4px);
    }

    /* --- Lightbox --- */
    .lb-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.92);
      z-index: 2000; display: flex; align-items: center; justify-content: center;
      padding: 20px; box-sizing: border-box;
    }
    .lb-inner { position: relative; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .lb-close {
      position: fixed; top: 16px; right: 20px; color: #fff; font-size: 1.8rem;
      cursor: pointer; background: none; border: none; line-height: 1; z-index: 2001;
      padding: 4px 10px; border-radius: 6px; transition: background .15s;
    }
    .lb-close:hover { background: rgba(255,255,255,.15); }
    .lb-img { max-width: 88vw; max-height: 80vh; object-fit: contain; border-radius: 6px; display: block; }
    .lb-caption { color: rgba(255,255,255,.8); font-size: .85rem; text-align: center; max-width: 600px; }
    .lb-nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.12); border: none; color: #fff;
      font-size: 1.6rem; cursor: pointer; padding: 10px 14px;
      border-radius: 8px; transition: background .15s; z-index: 2001;
    }
    .lb-nav:hover { background: rgba(255,255,255,.25); }
    .lb-prev { left: 12px; }
    .lb-next { right: 12px; }
    .lb-counter { color: rgba(255,255,255,.6); font-size: .8rem; }
    .lb-video-frame { width: min(760px, 88vw); aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #000; }
    .lb-video-frame iframe, .lb-video-frame video { width: 100%; height: 100%; border: none; }

    .album-not-found { text-align: center; padding: 100px 20px; }
    .album-not-found h2 { font-size: 1.5rem; margin-bottom: 12px; }

    @media (max-width: 600px) {
      .album-title { font-size: 1.5rem; }
      .album-media-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
      .album-media-item img, .album-media-video { height: 140px; }
    }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <div id="album-cover-wrap"></div>

  <div class="album-wrap">
    <div id="album-content">
      <div style="text-align:center;padding:80px 20px;color:var(--muted)">Yükleniyor…</div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" style="display:none"></div>

  <div id="pre-footer-cta"></div>
  <footer id="site-footer" class="footer"></footer>
  <script src="/js/main.js"></script>
  <script>
    let _lbItems = [];
    let _lbIdx = 0;

    function stripHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }

    function getYoutubeId(url) {
      const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }
    function getVimeoId(url) {
      const m = url.match(/vimeo\.com\/(\d+)/);
      return m ? m[1] : null;
    }
    function isDirectVideo(url) { return /\.(mp4|webm|ogg)(\?|$)/i.test(url); }

    function buildVideoEmbed(url) {
      const yt = getYoutubeId(url);
      if (yt) return `<iframe src="https://www.youtube.com/embed/${yt}?autoplay=1" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
      const vm = getVimeoId(url);
      if (vm) return `<iframe src="https://player.vimeo.com/video/${vm}?autoplay=1" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
      if (isDirectVideo(url)) return `<video src="${escapeHtml(url)}" controls autoplay style="max-width:100%;max-height:80vh"></video>`;
      return `<iframe src="${escapeHtml(url)}" allowfullscreen></iframe>`;
    }

    function getVideoThumb(url) {
      const yt = getYoutubeId(url);
      if (yt) return `https://img.youtube.com/vi/${yt}/mqdefault.jpg`;
      return '';
    }

    function openLightbox(idx) {
      _lbIdx = idx;
      renderLightbox();
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
      document.getElementById('lightbox').innerHTML = '';
      document.body.style.overflow = '';
    }

    function renderLightbox() {
      const lb = document.getElementById('lightbox');
      lb.style.display = 'flex';
      const m = _lbItems[_lbIdx];
      const isVideo = m.type === 'video';
      const content = isVideo
        ? `<div class="lb-video-frame">${buildVideoEmbed(m.url)}</div>`
        : `<img class="lb-img" src="${escapeHtml(m.url)}" alt="${escapeHtml(m.caption||'')}" />`;
      lb.innerHTML = `
        <div class="lb-backdrop" onclick="if(event.target===this)closeLightbox()">
          <button class="lb-close" onclick="closeLightbox()">✕</button>
          ${_lbItems.length > 1 ? `<button class="lb-nav lb-prev" onclick="lbNav(-1)">‹</button>` : ''}
          <div class="lb-inner">
            ${content}
            <div class="lb-counter">${_lbIdx + 1} / ${_lbItems.length}</div>
            ${m.caption ? `<div class="lb-caption">${escapeHtml(m.caption)}</div>` : ''}
          </div>
          ${_lbItems.length > 1 ? `<button class="lb-nav lb-next" onclick="lbNav(1)">›</button>` : ''}
        </div>
      `;
    }

    function lbNav(dir) {
      _lbIdx = (_lbIdx + dir + _lbItems.length) % _lbItems.length;
      renderLightbox();
    }

    document.addEventListener('keydown', e => {
      if (document.getElementById('lightbox').style.display === 'none') return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') lbNav(1);
      if (e.key === 'ArrowLeft') lbNav(-1);
    });

    window.addEventListener('app-ready', async () => {
      const slug = qs('slug');
      if (!slug) { renderNotFound(); return; }

      const album = await api('/api/gallery/' + encodeURIComponent(slug));
      if (!album || album.error) { renderNotFound(); return; }

      document.getElementById('page-title').textContent = album.title + ' — Galeri | Hayır Limanı Derneği';
      document.getElementById('page-desc').content = stripHtml(album.description || '').slice(0, 160);

      if (album.cover_image) {
        document.getElementById('album-cover-wrap').innerHTML =
          `<img class="album-hero-cover" src="${escapeHtml(album.cover_image)}" alt="${escapeHtml(album.title)}" />`;
      }

      const date = album.event_date
        ? new Date(album.event_date).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' })
        : '';

      _lbItems = album.media || [];

      const mediaHtml = _lbItems.length === 0
        ? '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">Bu albümde henüz medya yok.</div>'
        : _lbItems.map((m, idx) => {
          if (m.type === 'video') {
            const thumb = getVideoThumb(m.url);
            return `
              <div class="album-media-item" onclick="openLightbox(${idx})">
                ${thumb
                  ? `<img src="${thumb}" alt="${escapeHtml(m.caption||'')}" loading="lazy" />`
                  : `<div class="album-media-video">
                      <svg width="44" height="44" fill="white" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </div>`}
                <span class="album-media-video-badge">▶ Video</span>
                ${m.caption ? `<div class="album-media-caption">${escapeHtml(m.caption)}</div>` : ''}
              </div>`;
          }
          return `
            <div class="album-media-item" onclick="openLightbox(${idx})">
              <img src="${escapeHtml(m.url)}" alt="${escapeHtml(m.caption||album.title)}" loading="lazy" />
              ${m.caption ? `<div class="album-media-caption">${escapeHtml(m.caption)}</div>` : ''}
            </div>`;
        }).join('');

      document.getElementById('album-content').innerHTML = `
        <nav class="album-breadcrumb">
          <a href="/">Anasayfa</a> / <a href="/galeri.html">Galeri</a> / ${escapeHtml(album.title)}
        </nav>

        <div class="album-header">
          <div class="album-meta">
            ${date ? `<span class="album-meta-item">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              ${date}
            </span>` : ''}
            ${album.location ? `<span class="album-meta-item">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              ${escapeHtml(album.location)}
            </span>` : ''}
            ${_lbItems.length ? `<span class="album-meta-item">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              ${_lbItems.length} öğe
            </span>` : ''}
          </div>
          <h1 class="album-title">${escapeHtml(album.title)}</h1>
        </div>

        ${album.description && stripHtml(album.description).trim()
          ? `<div class="album-description">${album.description}</div>` : ''}

        <div class="album-media-grid">${mediaHtml}</div>
      `;
    });

    function renderNotFound() {
      document.getElementById('album-content').innerHTML = `
        <div class="album-not-found">
          <svg width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.3" viewBox="0 0 24 24" style="display:block;margin:0 auto 20px;opacity:.3">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <h2>Albüm bulunamadı</h2>
          <p style="color:var(--muted);margin-bottom:24px">Bu galeri albümü yayından kaldırılmış veya mevcut değil.</p>
          <a href="/galeri.html" class="btn btn-primary">← Galeriye Dön</a>
        </div>
      `;
    }
  </script>
</body>
</html>
