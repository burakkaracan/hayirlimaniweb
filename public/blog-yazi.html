<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Blog — Hayır Limanı Derneği</title>
  <meta name="description" id="page-desc" content="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/images/icon.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .post-cover {
      width: 100%; max-height: 460px; object-fit: cover; display: block;
      border-radius: 0 0 20px 20px; margin-bottom: 0;
    }
    .post-wrap { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

    .post-breadcrumb { font-size: .8rem; color: var(--muted); margin-bottom: 20px; }
    .post-breadcrumb a { color: var(--brand); text-decoration: none; }
    .post-breadcrumb a:hover { text-decoration: underline; }

    .post-cat-badge {
      display: inline-block; padding: 4px 14px; border-radius: 999px;
      background: #e0f2fe; color: #0369a1; font-size: .75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 16px;
    }
    .post-title {
      font-size: 2.2rem; font-weight: 800; color: var(--text);
      line-height: 1.3; margin: 0 0 16px;
    }
    .post-meta {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      font-size: .85rem; color: var(--muted); margin-bottom: 32px;
      padding-bottom: 24px; border-bottom: 1px solid var(--border);
    }
    .post-meta-item { display: flex; align-items: center; gap: 5px; }

    .post-body { font-size: 1.05rem; line-height: 1.85; color: var(--text); }
    .post-body h1 { font-size: 1.8rem; margin: 1.8rem 0 .6rem; }
    .post-body h2 { font-size: 1.5rem; margin: 1.5rem 0 .5rem; }
    .post-body h3 { font-size: 1.2rem; margin: 1.2rem 0 .4rem; }
    .post-body h4 { font-size: 1.05rem; margin: 1rem 0 .3rem; font-weight: 700; }
    .post-body p { margin: 0 0 1.2em; }
    .post-body ul, .post-body ol { padding-left: 1.6em; margin: 0 0 1.2em; }
    .post-body li { margin-bottom: .4em; }
    .post-body blockquote {
      border-left: 4px solid var(--brand); padding: 14px 20px;
      margin: 1.5rem 0; background: #f0fdfa; border-radius: 0 8px 8px 0;
      color: #0f766e; font-style: italic;
    }
    .post-body pre {
      background: #1e293b; color: #e2e8f0; padding: 20px;
      border-radius: 10px; overflow-x: auto; font-size: .92rem; margin: 1.5rem 0;
    }
    .post-body code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: .92em; }
    .post-body pre code { background: transparent; padding: 0; }
    .post-body img { max-width: 100%; border-radius: 8px; margin: 12px 0; }
    .post-body a { color: var(--brand); }
    .post-body a:hover { text-decoration: none; }
    .post-body hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    .post-body table { width: 100%; border-collapse: collapse; margin: 1.2rem 0; font-size: .95rem; }
    .post-body table th, .post-body table td { border: 1px solid var(--border); padding: 10px 14px; }
    .post-body table th { background: var(--bg); font-weight: 600; }

    .post-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); }
    .post-tag {
      padding: 4px 12px; border-radius: 6px; font-size: .78rem; font-weight: 600;
      background: #f1f5f9; color: var(--muted); text-decoration: none; transition: all .15s;
    }
    .post-tag:hover { background: var(--brand); color: #fff; }

    .post-share { margin-top: 28px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .post-share-label { font-size: .85rem; font-weight: 600; color: var(--muted); }
    .post-share-btn {
      display: flex; align-items: center; gap: 6px; padding: 8px 16px;
      border-radius: 8px; font-size: .85rem; font-weight: 600; cursor: pointer;
      text-decoration: none; transition: opacity .15s; border: none;
    }
    .post-share-btn:hover { opacity: .85; }
    .share-twitter { background: #1da1f2; color: #fff; }
    .share-facebook { background: #1877f2; color: #fff; }
    .share-whatsapp { background: #25d366; color: #fff; }
    .share-copy { background: #f1f5f9; color: var(--text); border: 1px solid var(--border) !important; }

    .post-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 40px; }
    .post-nav-card {
      display: block; padding: 16px 20px; background: #fff; border-radius: 12px;
      border: 1.5px solid var(--border); text-decoration: none; transition: border-color .15s;
    }
    .post-nav-card:hover { border-color: var(--brand); }
    .post-nav-card.next { text-align: right; }
    .post-nav-label { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .post-nav-title { font-size: .9rem; font-weight: 600; color: var(--text); line-height: 1.4; }

    .post-not-found { text-align: center; padding: 100px 20px; }
    .post-not-found h2 { font-size: 1.5rem; margin-bottom: 12px; }

    .post-loading { text-align: center; padding: 80px 20px; color: var(--muted); }

    @media (max-width: 600px) {
      .post-title { font-size: 1.6rem; }
      .post-body { font-size: 1rem; }
      .post-nav { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <div id="post-cover-wrap"></div>

  <div class="post-wrap">
    <div id="post-content">
      <div class="post-loading" style="text-align:center;padding:80px 20px;color:var(--muted)">Yükleniyor…</div>
    </div>
  </div>

  <div id="pre-footer-cta"></div>
  <footer id="site-footer" class="footer"></footer>
  <script src="/js/main.js"></script>
  <script>
    window.addEventListener('app-ready', async () => {
      const slug = qs('slug');
      if (!slug) { renderNotFound(); return; }

      const post = await api('/api/blog/' + encodeURIComponent(slug));
      if (!post || post.error) { renderNotFound(); return; }

      // Update <head> meta
      const seoTitle = post.seo_title || post.title;
      const seoDesc = post.seo_description || stripHtml(post.excerpt || post.body || '').slice(0, 160);
      document.getElementById('page-title').textContent = seoTitle + ' — Hayır Limanı Derneği';
      document.getElementById('page-desc').content = seoDesc;

      // Cover image
      if (post.cover_image) {
        document.getElementById('post-cover-wrap').innerHTML =
          `<img class="post-cover" src="${escapeHtml(post.cover_image)}" alt="${escapeHtml(post.title)}" />`;
      }

      const date = post.published_at
        ? new Date(post.published_at).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' })
        : '';

      const tags = (post.tags || '').split(',').map(t => t.trim()).filter(Boolean);

      document.getElementById('post-content').innerHTML = `
        <nav class="post-breadcrumb">
          <a href="/">Anasayfa</a> / <a href="/blog.html">Blog</a> / ${escapeHtml(post.title)}
        </nav>

        ${post.category ? `<span class="post-cat-badge">${escapeHtml(post.category)}</span>` : ''}

        <h1 class="post-title">${escapeHtml(post.title)}</h1>

        <div class="post-meta">
          ${date ? `<span class="post-meta-item">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            ${date}</span>` : ''}
          ${post.author ? `<span class="post-meta-item">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            ${escapeHtml(post.author)}</span>` : ''}
          ${post.category ? `<span class="post-meta-item">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            ${escapeHtml(post.category)}</span>` : ''}
        </div>

        <div class="post-body">${post.body || ''}</div>

        ${tags.length ? `
          <div class="post-tags">
            ${tags.map(t => `<span class="post-tag">#${escapeHtml(t)}</span>`).join('')}
          </div>
        ` : ''}

        <div class="post-share">
          <span class="post-share-label">Paylaş:</span>
          <a class="post-share-btn share-twitter"
            href="https://twitter.com/intent/tweet?url=${encodeURIComponent(location.href)}&text=${encodeURIComponent(post.title)}"
            target="_blank" rel="noopener">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            X (Twitter)
          </a>
          <a class="post-share-btn share-facebook"
            href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}"
            target="_blank" rel="noopener">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Facebook
          </a>
          <a class="post-share-btn share-whatsapp"
            href="https://wa.me/?text=${encodeURIComponent(post.title + ' — ' + location.href)}"
            target="_blank" rel="noopener">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            WhatsApp
          </a>
          <button class="post-share-btn share-copy" onclick="copyPostLink()" id="copy-link-btn">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Linki Kopyala
          </button>
        </div>
      `;
    });

    function renderNotFound() {
      document.getElementById('post-content').innerHTML = `
        <div class="post-not-found">
          <svg width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" viewBox="0 0 24 24" style="display:block;margin:0 auto 20px;opacity:.3">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <line x1="9" y1="15" x2="15" y2="15"/>
          </svg>
          <h2>Yazı bulunamadı</h2>
          <p style="color:var(--muted);margin-bottom:24px">Aradığınız blog yazısı yayından kaldırılmış ya da hiç yayımlanmamış olabilir.</p>
          <a href="/blog.html" class="btn btn-primary">← Blog'a Dön</a>
        </div>
      `;
    }

    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || '';
    }

    function copyPostLink() {
      navigator.clipboard.writeText(location.href).then(() => {
        const btn = document.getElementById('copy-link-btn');
        if (btn) { btn.textContent = '✅ Kopyalandı!'; setTimeout(() => { btn.innerHTML = '<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Linki Kopyala'; }, 2000); }
      });
    }
  </script>
</body>
</html>
