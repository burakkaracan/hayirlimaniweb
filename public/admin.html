<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Hayır Limanı Derneği</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/images/icon.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: var(--bg); padding-top: 0; }
    .data-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .data-form .wide { grid-column: 1 / -1; }
    .data-form label { display: block; margin-bottom: 4px; font-weight: 600; font-size: .85rem; }
    .data-form input, .data-form textarea, .data-form select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: var(--radius); background: #fff;
    }
    .data-form input[type="checkbox"] { width: auto; padding: 0; border: none; background: none; vertical-align: middle; }
    .data-form label:has(input[type="checkbox"]) { display: flex; align-items: center; gap: 8px; margin-bottom: 0; font-weight: 500; cursor: pointer; }
    .action-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .flex-spacer { flex: 1; }
    .chat-thread { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; padding: 12px; background: var(--bg); border-radius: var(--radius); margin-bottom: 12px; }
    .tab-bar { display: flex; gap: 2px; background: #fff; padding: 4px; border-radius: var(--radius); margin-bottom: 20px; overflow-x: auto; }
    .tab-bar button { padding: 10px 16px; border-radius: 8px; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .tab-bar button.active { background: var(--brand); color: #fff; }
    .msg-filter-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .msg-chip { padding: 5px 14px; border-radius: 999px; font-size: .85rem; font-weight: 600; border: 1.5px solid var(--border); background: #fff; color: var(--muted); cursor: pointer; transition: all .15s; }
    .msg-chip:hover { border-color: var(--brand); color: var(--brand); }
    .msg-chip.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    .msg-thread-item { transition: background .12s; }
    .msg-thread-item:hover { background: var(--bg); }
    .chart-range-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
    .chart-range-bar button { padding:6px 14px; border-radius:6px; font-size:.82rem; font-weight:600; border:1.5px solid var(--border); background:#fff; color:var(--muted); cursor:pointer; transition:all .15s; }
    .chart-range-bar button.active, .chart-range-bar button:hover { border-color:var(--brand); color:var(--brand); background:#f0fdfa; }
    .chart-range-bar input[type=date] { padding:5px 10px; border:1.5px solid var(--border); border-radius:6px; font-size:.82rem; color:var(--text); }
    .chart-range-bar .sep { color:var(--muted); font-size:.85rem; }
    @media (max-width: 820px) {
      .data-form { grid-template-columns: 1fr !important; }
      .chart-range-bar .sep { display: none; }
      .admin-head h2 { font-size: 1.2rem; }
      table { font-size: .82rem; }
      table th, table td { padding: 8px 6px; }
      .btn-sm { padding: 5px 8px; font-size: .75rem; }
    }

    /* ===== Blog Editor ===== */
    .blog-editor-wrap { display:flex; flex-direction:column; margin:-24px; min-height:calc(100vh - 56px); }
    .blog-editor-topbar {
      display:flex; align-items:center; gap:12px; padding:10px 20px;
      background:#fff; border-bottom:1px solid var(--border);
      position:sticky; top:0; z-index:50; flex-wrap:wrap;
    }
    .blog-editor-topbar-title { flex:1; font-size:.9rem; font-weight:600; color:var(--muted); }
    .blog-editor-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .blog-editor-body { display:grid; grid-template-columns:1fr 300px; flex:1; min-height:0; }
    .blog-editor-main { padding:28px 36px; overflow-y:auto; }
    .blog-title-textarea {
      width:100%; border:none; outline:none; resize:none; overflow:hidden;
      font-size:1.9rem; font-weight:700; color:var(--text); line-height:1.3;
      padding:0 0 14px; border-bottom:2px solid var(--border); margin-bottom:10px;
      background:transparent; font-family:inherit; box-sizing:border-box;
    }
    .blog-title-textarea::placeholder { color:#ccc; }
    .blog-slug-row {
      display:flex; align-items:center; gap:4px; margin-bottom:20px; flex-wrap:wrap;
      font-size:.82rem; color:var(--muted);
    }
    .blog-slug-input {
      border:none; border-bottom:1.5px dashed var(--border); outline:none;
      font-size:.82rem; color:var(--brand); padding:2px 4px;
      background:transparent; min-width:150px; max-width:300px;
    }
    .blog-slug-input:focus { border-bottom-color:var(--brand); }
    #quill-container { border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
    #quill-toolbar { background:#fafafa !important; border:none !important; border-bottom:1px solid var(--border) !important; }
    #quill-editor { min-height:520px; font-size:1rem; }
    .ql-editor { min-height:520px; font-size:1rem; line-height:1.8; padding:20px 24px; }
    .ql-editor h1 { font-size:1.8rem; margin:1rem 0 .5rem; }
    .ql-editor h2 { font-size:1.4rem; margin:.9rem 0 .4rem; }
    .ql-editor h3 { font-size:1.15rem; margin:.8rem 0 .3rem; }
    .ql-editor h4 { font-size:1rem; margin:.7rem 0 .25rem; }
    .ql-editor blockquote { border-left:4px solid var(--brand); padding-left:16px; color:var(--muted); font-style:italic; margin:1rem 0; }
    .ql-editor pre { background:#1e293b; color:#e2e8f0; padding:16px; border-radius:8px; overflow-x:auto; font-size:.9rem; }
    .ql-editor img { max-width:100%; border-radius:6px; margin:8px 0; }
    .blog-editor-sidebar { overflow-y:auto; background:#f8fafc; border-left:1px solid var(--border); }
    .blog-sidebar-box { border-bottom:1px solid var(--border); }
    .blog-sidebar-box-head {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 16px; cursor:pointer; user-select:none; background:#fff;
    }
    .blog-sidebar-box-head:hover { background:#f1f5f9; }
    .blog-sidebar-box-head h4 { margin:0; font-size:.88rem; font-weight:600; }
    .blog-sidebar-box-head .bs-arrow { font-size:.75rem; color:var(--muted); transition:transform .2s; }
    .blog-sidebar-box-body { padding:14px 16px; background:#fff; }
    .blog-sidebar-box-body .bsb-field { margin-bottom:10px; }
    .blog-sidebar-box-body .bsb-field label { display:block; font-size:.78rem; font-weight:600; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em; }
    .blog-sidebar-box-body input[type=text],
    .blog-sidebar-box-body input[type=datetime-local],
    .blog-sidebar-box-body textarea,
    .blog-sidebar-box-body select {
      width:100%; padding:8px 10px; border:1px solid var(--border);
      border-radius:var(--radius); font-size:.88rem; font-family:inherit;
      box-sizing:border-box; background:#fff; color:var(--text);
    }
    .blog-sidebar-box-body textarea { resize:vertical; }
    .blog-sidebar-box-body input:focus,
    .blog-sidebar-box-body textarea:focus,
    .blog-sidebar-box-body select:focus { border-color:var(--brand); outline:none; }
    .blog-cover-preview {
      background:#f1f5f9; border-radius:8px; overflow:hidden;
      min-height:60px; display:flex; align-items:center; justify-content:center;
      margin-bottom:10px; font-size:.82rem; color:#bbb;
    }
    .blog-cover-preview img { width:100%; display:block; max-height:140px; object-fit:cover; }
    .blog-cat-pills { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
    .blog-cat-pill {
      padding:3px 10px; border-radius:999px; font-size:.75rem; border:1px solid var(--border);
      background:#fff; cursor:pointer; color:var(--muted); transition:all .12s;
    }
    .blog-cat-pill:hover { border-color:var(--brand); color:var(--brand); }
    .blog-save-status { font-size:.82rem; padding:4px 10px; border-radius:6px; }
    .blog-save-status.ok { background:#dcfce7; color:#16a34a; }
    .blog-save-status.err { background:#fee2e2; color:#dc2626; }
    @media (max-width:900px) {
      .blog-editor-body { grid-template-columns:1fr; }
      .blog-editor-sidebar { border-left:none; border-top:1px solid var(--border); }
      .blog-editor-main { padding:16px; }
      .blog-title-textarea { font-size:1.4rem; }
    }

    /* ===== Gallery Media Grid ===== */
    .gal-media-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; min-height:60px;
    }
    .gal-media-item {
      border-radius:8px; overflow:hidden; border:1px solid var(--border);
      background:#fff; display:flex; flex-direction:column;
    }
    .gal-media-thumb {
      width:100%; height:110px; object-fit:cover; display:block;
    }
    .gal-media-video-thumb {
      width:100%; height:110px; background:#1e293b; display:flex; align-items:center; justify-content:center;
    }
    .gal-media-item-footer {
      display:flex; align-items:center; padding:5px 6px; gap:4px; background:#fafafa; border-top:1px solid var(--border);
    }
    .gal-media-type-badge { font-size:.68rem; color:var(--muted); font-weight:600; }
    .gal-media-caption {
      padding:4px 8px 6px; font-size:.72rem; color:var(--muted); line-height:1.4;
      background:#fff; border-top:1px solid #f1f5f9;
    }
    .gal-media-empty { grid-column:1/-1; text-align:center; padding:32px 20px; color:var(--muted); font-size:.88rem; background:var(--bg); border-radius:8px; border:1.5px dashed var(--border); }
    @media (max-width:600px) { .gal-media-grid { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
  <div id="admin-root">
    <div class="loader">Yükleniyor…</div>
  </div>

  <div class="modal-backdrop" id="modal"><div class="modal" id="modal-body"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.0/dist/apexcharts.min.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
